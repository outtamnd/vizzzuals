<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vizzzuals</title>
  <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.0/build/mp4-muxer.min.js"></script>
  <style>
    :root {
      --bg-color: #0b0b0e;
      --card-bg: #16161a;
      --accent-color: #7257ff;
      --text-main: #fffffe;
      --text-muted: #94a1b2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .app-container {
      width: 100%;
      max-width: 1200px;
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 30px;
    }

    .controls-panel {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      border: 1px solid #242429;
      max-height: 90vh;
      overflow-y: auto;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.05em;
      color: var(--text-main);
    }

    .section-title {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .dropzone {
      border: 2px dashed #33333d;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      background: #101014;
    }

    .dropzone:hover {
      border-color: var(--accent-color);
      background: #14141a;
    }

    .platform-selector {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .platform-btn, .style-btn {
      background: #202026;
      border: 1px solid #2e2e38;
      color: var(--text-main);
      padding: 8px;
      border-radius: 8px;
      font-size: 0.75rem;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .platform-btn.active, .style-btn.active {
      background: var(--accent-color);
      border-color: var(--accent-color);
    }

    .styles-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    input[type="text"], input[type="file"] {
      width: 100%;
      padding: 10px 12px;
      background: #101014;
      border: 1px solid #2a2a32;
      border-radius: 8px;
      color: #fff;
      outline: none;
      font-size: 0.9rem;
    }

    .preview-panel {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid #242429;
      min-height: 500px;
    }

    .canvas-wrapper {
      max-width: 100%;
      max-height: 600px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    canvas {
      display: block;
      max-width: 100%;
      max-height: 550px;
      object-fit: contain;
    }

    .action-btn {
      width: 100%;
      padding: 14px;
      background: var(--accent-color);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .action-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="controls-panel">
      <h1>vizzzuals</h1>

      <div>
        <div class="section-title">Audio File</div>
        <div class="dropzone" id="dropzone">
          <p style="font-size: 0.85rem; color: var(--text-muted);">Drag & drop audio or click</p>
          <input type="file" id="audioInput" accept="audio/*" style="display: none;">
        </div>
      </div>

      <div>
        <div class="section-title">Platform Ratio</div>
        <div class="platform-selector">
          <button class="platform-btn active" data-ratio="9:16">Story (9:16)</button>
          <button class="platform-btn" data-ratio="1:1">Feed (1:1)</button>
          <button class="platform-btn" data-ratio="16:9">Wide (16:9)</button>
        </div>
      </div>

      <div>
        <div class="section-title">Visualizer Style (Dynamic Presets)</div>
        <div class="styles-grid">
          <button class="style-btn active" data-style="1">1. Audio Scanner</button>
          <button class="style-btn" data-style="2">2. Orbiting Pulsar</button>
          <button class="style-btn" data-style="3">3. Floating Horizon</button>
          <button class="style-btn" data-style="4">4. Cyber Snake</button>
          <button class="style-btn" data-style="5">5. Floating Vinyl</button>
          <button class="style-btn" data-style="6">6. Particle Storm</button>
          <button class="style-btn" data-style="7">7. Soundwave Tunnel</button>
          <button class="style-btn" data-style="8">8. Bass Warp Grid</button>
          <button class="style-btn" data-style="9">9. Traveling DNA</button>
          <button class="style-btn" data-style="10">10. Neon Ring Flow</button>
        </div>
      </div>

      <div>
        <div class="section-title">Track Details</div>
        <input type="text" id="trackTitle" placeholder="Track Title" style="margin-bottom: 8px;">
        <input type="text" id="artistName" placeholder="Artist / Producer">
      </div>

      <div>
        <div class="section-title">Background Image (Optional)</div>
        <input type="file" id="bgInput" accept="image/*">
      </div>

      <button class="action-btn" id="exportBtn">Export MP4 Video</button>
    </div>

    <div class="preview-panel">
      <div class="canvas-wrapper">
        <canvas id="visualizerCanvas" width="1080" height="1920"></canvas>
      </div>
    </div>
  </div>

  <script>
    const dropzone = document.getElementById('dropzone');
    const audioInput = document.getElementById('audioInput');
    const bgInput = document.getElementById('bgInput');
    const canvas = document.getElementById('visualizerCanvas');
    const ctx = canvas.getContext('2d');
    const platformBtns = document.querySelectorAll('.platform-btn');
    const styleBtns = document.querySelectorAll('.style-btn');
    const exportBtn = document.getElementById('exportBtn');

    let audioContext, audioElement, analyser, sourceNode;
    let audioFile = null;
    let bgImage = null;
    let isPlaying = false;
    let animationId = null;
    let muxer = null;
    let videoEncoder = null;
    let audioEncoder = null;
    let recordingInterval = null;
    let startTime = 0;
    let currentStyle = '1';

    // Motion variables for screen traversal
    let scanPos = 0;
    let scanDirection = 1;
    let orbitAngle = 0;
    let particles = [];

    const ratios = {
      '9:16': { width: 1080, height: 1920 },
      '1:1':  { width: 1080, height: 1080 },
      '16:9': { width: 1920, height: 1080 }
    };
    let currentRatio = '9:16';

    platformBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        platformBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentRatio = btn.getAttribute('data-ratio');
        canvas.width = ratios[currentRatio].width;
        canvas.height = ratios[currentRatio].height;
      });
    });

    styleBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        styleBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentStyle = btn.getAttribute('data-style');
      });
    });

    dropzone.addEventListener('click', () => audioInput.click());
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.style.borderColor = 'var(--accent-color)'; });
    dropzone.addEventListener('dragleave', () => { dropzone.style.borderColor = '#33333d'; });
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.style.borderColor = '#33333d';
      if (e.dataTransfer.files.length) handleAudioFile(e.dataTransfer.files[0]);
    });

    audioInput.addEventListener('change', (e) => {
      if (e.target.files.length) handleAudioFile(e.target.files[0]);
    });

    bgInput.addEventListener('change', (e) => {
      if (e.target.files.length) {
        const reader = new FileReader();
        reader.onload = (event) => {
          bgImage = new Image();
          bgImage.src = event.target.result;
        };
        reader.readAsDataURL(e.target.files[0]);
      }
    });

    function handleAudioFile(file) {
      audioFile = URL.createObjectURL(file);
      dropzone.querySelector('p').textContent = `Loaded: ${file.name}`;
      const titleInput = document.getElementById('trackTitle');
      if (!titleInput.value) {
        titleInput.value = file.name.replace(/\.[^/.]+$/, "");
      }
      setupAudioContext();
    }

    function setupAudioContext() {
      if (audioElement) audioElement.pause();

      audioElement = new Audio(audioFile);
      audioElement.crossOrigin = "anonymous";
      
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 256;

      sourceNode = audioContext.createMediaElementSource(audioElement);
      sourceNode.connect(analyser);
      analyser.connect(audioContext.destination);

      audioElement.play();
      isPlaying = true;

      // Initialize dynamic particle system
      particles = [];
      for(let i=0; i<80; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 4,
          vy: (Math.random() - 0.5) * 4,
          size: Math.random() * 4 + 2
        });
      }

      if (animationId) cancelAnimationFrame(animationId);
      drawVisualizer();
    }

    function drawVisualizer() {
      animationId = requestAnimationFrame(drawVisualizer);

      const width = canvas.width;
      const height = canvas.height;
      ctx.clearRect(0, 0, width, height);

      if (bgImage) {
        ctx.drawImage(bgImage, 0, 0, width, height);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
        ctx.fillRect(0, 0, width, height);
      } else {
        ctx.fillStyle = '#050507';
        ctx.fillRect(0, 0, width, height);
      }

      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      analyser.getByteFrequencyData(dataArray);

      let bassSum = 0;
      for (let i = 0; i < 10; i++) bassSum += dataArray[i];
      let bassAvg = bassSum / 10; // Bass magnitude

      let overallSum = 0;
      for (let i = 0; i < bufferLength; i++) overallSum += dataArray[i];
      let overallAvg = overallSum / bufferLength;

      // Update scan & orbit positions based on audio energy
      scanPos += (2 + (bassAvg * 0.05)) * scanDirection;
      if (scanPos > height * 0.7 || scanPos < 0) scanDirection *= -1;

      orbitAngle += 0.02 + (overallAvg * 0.0005);

      ctx.save();
      switch(currentStyle) {
        case '1': // Audio Scanner (Bars move top to bottom following audio intensity)
          {
            const y = height * 0.2 + scanPos;
            const barWidth = width / bufferLength;
            for (let i = 0; i < bufferLength; i++) {
              const h = (dataArray[i] / 255) * (height * 0.3);
              ctx.fillStyle = `hsl(${180 + (i * 3)}, 100%, 60%)`;
              ctx.shadowBlur = 15;
              ctx.shadowColor = `hsl(${180 + (i * 3)}, 100%, 60%)`;
              ctx.fillRect(i * barWidth, y - (h/2), barWidth - 2, h);
            }

            // Laser Scanline
            ctx.strokeStyle = '#ff4757';
            ctx.lineWidth = 3;
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#ff4757';
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(width, y);
            ctx.stroke();
          }
          break;

        case '2': // Orbiting Pulsar (Ring orbits around the canvas reacting to bass)
          {
            const cx = width / 2 + Math.cos(orbitAngle) * (width * 0.25);
            const cy = height / 2 + Math.sin(orbitAngle * 1.5) * (height * 0.2);
            const baseRadius = 120 + (bassAvg * 0.8);

            ctx.translate(cx, cy);
            for (let i = 0; i < bufferLength; i += 2) {
              const angle = (i * 2 * Math.PI) / bufferLength;
              const len = (dataArray[i] / 255) * 150;
              const x1 = Math.cos(angle) * baseRadius;
              const y1 = Math.sin(angle) * baseRadius;
              const x2 = Math.cos(angle) * (baseRadius + len);
              const y2 = Math.sin(angle) * (baseRadius + len);

              ctx.strokeStyle = `hsl(${260 + (i * 2)}, 100%, 65%)`;
              ctx.lineWidth = 4;
              ctx.shadowBlur = 10;
              ctx.shadowColor = `hsl(${260 + (i * 2)}, 100%, 65%)`;
              ctx.beginPath();
              ctx.moveTo(x1, y1);
              ctx.lineTo(x2, y2);
              ctx.stroke();
            }
          }
          break;

        case '3': // Floating Horizon (Perspective waveform sweeping across the screen)
          {
            const startY = height * 0.5 + Math.sin(performance.now() * 0.002) * (height * 0.1);
            const slice = width / bufferLength;
            ctx.beginPath();
            ctx.moveTo(0, startY);
            for (let i = 0; i < bufferLength; i++) {
              const x = i * slice;
              const offset = ((dataArray[i] / 255) - 0.5) * (height * 0.35);
              ctx.lineTo(x, startY + offset);
            }
            ctx.strokeStyle = '#00d2d3';
            ctx.lineWidth = 6;
            ctx.shadowBlur = 25;
            ctx.shadowColor = '#00d2d3';
            ctx.stroke();
          }
          break;

        case '4': // Cyber Snake (Continuous glowing path moving across the canvas)
          {
            ctx.beginPath();
            const time = performance.now() * 0.003;
            for (let i = 0; i < bufferLength; i++) {
              const progress = i / bufferLength;
              const x = (progress * width + (time * 100)) % width;
              const amp = (dataArray[i] / 255) * (height * 0.25);
              const y = (height / 2) + Math.sin(progress * Math.PI * 4 + time) * 200 + amp;

              if (i === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            }
            ctx.strokeStyle = '#ff9f43';
            ctx.lineWidth = 8;
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#ff9f43';
            ctx.stroke();
          }
          break;

        case '5': // Floating Vinyl (Album disc floating around the screen reacting to music)
          {
            const cx = width / 2 + Math.sin(orbitAngle * 0.8) * (width * 0.2);
            const cy = height / 2 + Math.cos(orbitAngle * 1.2) * (height * 0.15);
            const radius = 220 + (bassAvg * 0.4);

            ctx.translate(cx, cy);
            ctx.rotate(orbitAngle * 2);

            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fillStyle = '#111';
            ctx.shadowBlur = 30;
            ctx.shadowColor = '#7257ff';
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#333';
            ctx.stroke();

            // Frequency bars sprouting from the disc border
            for (let i = 0; i < bufferLength; i += 3) {
              const angle = (i * 2 * Math.PI) / bufferLength;
              const len = (dataArray[i] / 255) * 80;
              ctx.strokeStyle = '#7257ff';
              ctx.lineWidth = 3;
              ctx.beginPath();
              ctx.moveTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
              ctx.lineTo(Math.cos(angle) * (radius + len), Math.sin(angle) * (radius + len));
              ctx.stroke();
            }
          }
          break;

        case '6': // Particle Storm (Particles speed up and travel based on beat velocity)
          {
            particles.forEach((p, idx) => {
              const energy = dataArray[idx % bufferLength] / 255;
              p.x += p.vx * (1 + energy * 4);
              p.y += p.vy * (1 + energy * 4);

              if (p.x < 0) p.x = width;
              if (p.x > width) p.x = 0;
              if (p.y < 0) p.y = height;
              if (p.y > height) p.y = 0;

              ctx.beginPath();
              ctx.arc(p.x, p.y, p.size + (energy * 10), 0, Math.PI * 2);
              ctx.fillStyle = `hsl(${energy * 360}, 100%, 60%)`;
              ctx.shadowBlur = 15;
              ctx.shadowColor = `hsl(${energy * 360}, 100%, 60%)`;
              ctx.fill();
            });
          }
          break;

        case '7': // Soundwave Tunnel (Concentric expanding rings sweeping toward the viewer)
          {
            const cx = width / 2;
            const cy = height / 2;
            for (let i = 0; i < 8; i++) {
              const energy = dataArray[i * 4] / 255;
              const r = ((performance.now() * 0.2 + (i * 100)) % (width * 0.6)) + (energy * 50);
              ctx.beginPath();
              ctx.arc(cx, cy, r, 0, Math.PI * 2);
              ctx.strokeStyle = `rgba(114, 87, 255, ${Math.max(0, 1 - (r / (width * 0.6)))})`;
              ctx.lineWidth = 4 + (energy * 8);
              ctx.shadowBlur = 15;
              ctx.shadowColor = '#7257ff';
              ctx.stroke();
            }
          }
          break;

        case '8': // Bass Warp Grid (Dynamic reactive grid flexing to the 808s)
          {
            const gridSpacing = 80;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 2;

            for (let x = 0; x < width; x += gridSpacing) {
              ctx.beginPath();
              for (let y = 0; y < height; y += 40) {
                const idx = Math.floor((x + y) / 10) % bufferLength;
                const offset = (dataArray[idx] / 255) * 30;
                if (y === 0) ctx.moveTo(x + offset, y);
                else ctx.lineTo(x + offset, y);
              }
              ctx.strokeStyle = '#54a0ff';
              ctx.stroke();
            }
          }
          break;

        case '9': // Traveling DNA Helix (Symmetrical double helix moving horizontally)
          {
            const cx = width / 2;
            const time = performance.now() * 0.004;
            for (let i = 0; i < bufferLength; i++) {
              const y = (i / bufferLength) * height;
              const energy = dataArray[i] / 255;
              const offset1 = Math.sin(time + (i * 0.15)) * (200 + (energy * 100));
              const offset2 = -offset1;

              ctx.fillStyle = '#ff4757';
              ctx.beginPath();
              ctx.arc(cx + offset1, y, 6 + (energy * 6), 0, Math.PI * 2);
              ctx.fill();

              ctx.fillStyle = '#2ed573';
              ctx.beginPath();
              ctx.arc(cx + offset2, y, 6 + (energy * 6), 0, Math.PI * 2);
              ctx.fill();

              if (i % 2 === 0) {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.beginPath();
                ctx.moveTo(cx + offset1, y);
                ctx.lineTo(cx + offset2, y);
                ctx.stroke();
              }
            }
          }
          break;

        case '10': // Neon Ring Flow (Tilted ring shifting position and pulsating)
          {
            const cx = width / 2 + Math.sin(orbitAngle) * 80;
            const cy = height / 2 + Math.cos(orbitAngle) * 80;

            ctx.translate(cx, cy);
            ctx.scale(1, 0.4); // Tilt effect
            ctx.rotate(orbitAngle);

            for (let i = 0; i < bufferLength; i++) {
              const angle = (i * 2 * Math.PI) / bufferLength;
              const r = 300 + ((dataArray[i] / 255) * 180);
              const x = Math.cos(angle) * r;
              const y = Math.sin(angle) * r;

              ctx.fillStyle = `hsl(${i * 4}, 100%, 60%)`;
              ctx.shadowBlur = 15;
              ctx.shadowColor = `hsl(${i * 4}, 100%, 60%)`;
              ctx.beginPath();
              ctx.arc(x, y, 8, 0, Math.PI * 2);
              ctx.fill();
            }
          }
          break;
      }
      ctx.restore();

      // Track Details Overlay
      const title = document.getElementById('trackTitle').value;
      const artist = document.getElementById('artistName').value;
      if (title || artist) {
        ctx.save();
        ctx.fillStyle = '#ffffff';
        ctx.font = `bold ${Math.floor(width * 0.045)}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText(title, width / 2, height * 0.18);

        ctx.fillStyle = '#94a1b2';
        ctx.font = `${Math.floor(width * 0.03)}px sans-serif`;
        ctx.fillText(artist, width / 2, height * 0.24);
        ctx.restore();
      }
    }

    // MP4 Export Logic
    exportBtn.addEventListener('click', async () => {
      if (!audioElement || !isPlaying) {
        alert('Please load and play an audio file first!');
        return;
      }

      if (videoEncoder) {
        stopMp4Export();
        return;
      }

      audioElement.currentTime = 0;
      audioElement.play();

      exportBtn.textContent = 'Initializing MP4 Export...';
      exportBtn.style.background = '#ff4757';

      muxer = new Mp4Muxer.Muxer({
        target: new Mp4Muxer.ArrayBufferTarget(),
        video: { codec: 'avc', width: canvas.width, height: canvas.height },
        audio: { codec: 'aac', sampleRate: audioContext.sampleRate, numberOfChannels: 2 },
        fastStart: 'in-memory'
      });

      videoEncoder = new VideoEncoder({
        output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
        error: e => console.error(e)
      });

      videoEncoder.configure({
        codec: 'avc1.42001f',
        width: canvas.width,
        height: canvas.height,
        bitrate: 5_000_000,
        framerate: 30
      });

      const dest = audioContext.createMediaStreamDestination();
      sourceNode.connect(dest);

      audioEncoder = new AudioEncoder({
        output: (chunk, meta) => muxer.addAudioChunk(chunk, meta),
        error: e => console.error(e)
      });

      audioEncoder.configure({
        codec: 'mp4a.40.2',
        sampleRate: audioContext.sampleRate,
        numberOfChannels: 2,
        bitrate: 128_000
      });

      startTime = performance.now();
      let frameIndex = 0;
      const fps = 30;
      const intervalMs = 1000 / fps;

      exportBtn.textContent = 'Recording MP4... Click to Stop & Save';

      recordingInterval = setInterval(async () => {
        if (audioElement.ended) {
          stopMp4Export();
          return;
        }
        const timestamp = (performance.now() - startTime) * 1000;
        const frame = new VideoFrame(canvas, { timestamp });
        videoEncoder.encode(frame, { keyFrame: frameIndex % 60 === 0 });
        frame.close();
        frameIndex++;
      }, intervalMs);

      const processor = audioContext.createScriptProcessor(4096, 2, 2);
      sourceNode.connect(processor);
      processor.connect(audioContext.destination);

      processor.onaudioprocess = (e) => {
        if (!audioEncoder || audioEncoder.state === 'closed') return;
        const inputBuffer = e.inputBuffer;
        const audioData = new AudioData({
          format: 'f32-planar',
          sampleRate: inputBuffer.sampleRate,
          numberOfFrames: inputBuffer.length,
          numberOfChannels: 2,
          timestamp: (performance.now() - startTime) * 1000,
          data: [inputBuffer.getChannelData(0), inputBuffer.getChannelData(1)]
        });
        audioEncoder.encode(audioData);
        audioData.close();
      };

      window.activeAudioProcessor = processor;
    });

    async function stopMp4Export() {
      if (recordingInterval) clearInterval(recordingInterval);
      if (window.activeAudioProcessor) {
        window.activeAudioProcessor.disconnect();
        window.activeAudioProcessor = null;
      }

      if (videoEncoder) {
        await videoEncoder.flush();
        videoEncoder.close();
        videoEncoder = null;
      }

      if (audioEncoder) {
        await audioEncoder.flush();
        audioEncoder.close();
        audioEncoder = null;
      }

      if (muxer) {
        muxer.finalize();
        const buffer = muxer.target.buffer;
        const blob = new Blob([buffer], { type: 'video/mp4' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = `${document.getElementById('trackTitle').value || 'vizzzual'}.mp4`;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          window.URL.revokeObjectURL(url);
        }, 100);
        muxer = null;
      }

      exportBtn.textContent = 'Export MP4 Video';
      exportBtn.style.background = 'var(--accent-color)';
    }
  </script>
</body>
</html>
