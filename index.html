<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vizzzuals</title>
  <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.0/build/mp4-muxer.min.js"></script>
  <style>
    :root {
      --bg-color: #020005;
      --card-bg: #0b0514;
      --accent-color: #ff00ea;
      --accent-hover: #cc00bb;
      --text-main: #fffffe;
      --text-muted: #9b8abf;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .app-container {
      width: 100%;
      max-width: 1250px;
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 30px;
    }

    .controls-panel {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      border: 1px solid #2a1142;
      max-height: 90vh;
      overflow-y: auto;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.05em;
      color: var(--text-main);
      text-shadow: 0 0 15px rgba(255, 0, 234, 0.6);
    }

    .section-title {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .dropzone {
      border: 2px dashed #421b6b;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      background: #07020d;
    }

    .dropzone:hover {
      border-color: var(--accent-color);
      background: #140521;
    }

    .playback-bar {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .play-btn {
      flex: 1;
      padding: 12px;
      background: #1a082b;
      border: 1px solid #3c1261;
      color: #fff;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .play-btn:hover {
      background: var(--accent-color);
      border-color: var(--accent-color);
    }

    .platform-selector {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .platform-btn, .style-btn {
      background: #12051f;
      border: 1px solid #2c1047;
      color: var(--text-main);
      padding: 9px;
      border-radius: 8px;
      font-size: 0.75rem;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .platform-btn.active, .style-btn.active {
      background: var(--accent-color);
      border-color: var(--accent-color);
      box-shadow: 0 0 15px rgba(255, 0, 234, 0.5);
    }

    .styles-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    input[type="file"] {
      display: none;
    }

    .preview-panel {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid #2a1142;
      min-height: 500px;
    }

    .canvas-wrapper {
      max-width: 100%;
      max-height: 600px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(255, 0, 234, 0.3);
    }

    canvas {
      display: block;
      max-width: 100%;
      max-height: 550px;
      object-fit: contain;
    }

    .action-btn {
      width: 100%;
      padding: 14px;
      background: var(--accent-color);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .action-btn:hover {
      background: var(--accent-hover);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="controls-panel">
      <h1>vizzzuals</h1>

      <div>
        <div class="section-title">Audio File</div>
        <div class="dropzone" id="dropzone">
          <p style="font-size: 0.85rem; color: var(--text-muted);">Drag & drop audio or click</p>
          <input type="file" id="audioInput" accept="audio/*">
        </div>
      </div>

      <div>
        <div class="section-title">Playback</div>
        <div class="playback-bar">
          <button class="play-btn" id="playPauseBtn" disabled>
            <span id="playIcon">▶</span> <span id="playText">Play</span>
          </button>
        </div>
      </div>

      <div>
        <div class="section-title">Platform Ratio</div>
        <div class="platform-selector">
          <button class="platform-btn active" data-ratio="9:16">Story (9:16)</button>
          <button class="platform-btn" data-ratio="1:1">Feed (1:1)</button>
          <button class="platform-btn" data-ratio="16:9">Wide (16:9)</button>
        </div>
      </div>

      <div>
        <div class="section-title">Psychedelic Presets</div>
        <div class="styles-grid">
          <button class="style-btn active" data-style="1">1. Acid Melt Wave</button>
          <button class="style-btn" data-style="2">2. Hypno Kaleidoscope</button>
          <button class="style-btn" data-style="3">3. Liquid DMT Tunnel</button>
          <button class="style-btn" data-style="4">4. Psychedelic Mandalas</button>
          <button class="style-btn" data-style="5">5. Electric Jellyfish</button>
          <button class="style-btn" data-style="6">6. Rainbow Liquid Mirror</button>
          <button class="style-btn" data-style="7">7. Cosmic Third Eye</button>
          <button class="style-btn" data-style="8">8. Morphing Plasma Web</button>
          <button class="style-btn" data-style="9">9. Infinite Ripple Void</button>
          <button class="style-btn" data-style="10">10. Stroboscopic Portal</button>
        </div>
      </div>

      <div>
        <div class="section-title">Background Image (Optional)</div>
        <input type="file" id="bgInput" accept="image/*" style="display:block;">
      </div>

      <button class="action-btn" id="exportBtn">Export MP4 Video</button>
    </div>

    <div class="preview-panel">
      <div class="canvas-wrapper">
        <canvas id="visualizerCanvas" width="1080" height="1920"></canvas>
      </div>
    </div>
  </div>

  <script>
    const dropzone = document.getElementById('dropzone');
    const audioInput = document.getElementById('audioInput');
    const bgInput = document.getElementById('bgInput');
    const canvas = document.getElementById('visualizerCanvas');
    const ctx = canvas.getContext('2d');
    const platformBtns = document.querySelectorAll('.platform-btn');
    const styleBtns = document.querySelectorAll('.style-btn');
    const exportBtn = document.getElementById('exportBtn');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon = document.getElementById('playIcon');
    const playText = document.getElementById('playText');

    let audioContext, audioElement, analyser, sourceNode;
    let audioFile = null;
    let bgImage = null;
    let isPlaying = false;
    let animationId = null;
    let muxer = null;
    let videoEncoder = null;
    let audioEncoder = null;
    let recordingInterval = null;
    let startTime = 0;
    let currentStyle = '1';
    let time = 0;

    const ratios = {
      '9:16': { width: 1080, height: 1920 },
      '1:1':  { width: 1080, height: 1080 },
      '16:9': { width: 1920, height: 1080 }
    };
    let currentRatio = '9:16';

    platformBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        platformBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentRatio = btn.getAttribute('data-ratio');
        canvas.width = ratios[currentRatio].width;
        canvas.height = ratios[currentRatio].height;
      });
    });

    styleBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        styleBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentStyle = btn.getAttribute('data-style');
      });
    });

    dropzone.addEventListener('click', () => audioInput.click());
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.style.borderColor = 'var(--accent-color)'; });
    dropzone.addEventListener('dragleave', () => { dropzone.style.borderColor = '#421b6b'; });
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.style.borderColor = '#421b6b';
      if (e.dataTransfer.files.length) handleAudioFile(e.dataTransfer.files[0]);
    });

    audioInput.addEventListener('change', (e) => {
      if (e.target.files.length) handleAudioFile(e.target.files[0]);
    });

    bgInput.addEventListener('change', (e) => {
      if (e.target.files.length) {
        const reader = new FileReader();
        reader.onload = (event) => {
          bgImage = new Image();
          bgImage.src = event.target.result;
        };
        reader.readAsDataURL(e.target.files[0]);
      }
    });

    function handleAudioFile(file) {
      audioFile = URL.createObjectURL(file);
      dropzone.querySelector('p').textContent = `Loaded: ${file.name}`;
      setupAudioContext();
    }

    function setupAudioContext() {
      if (audioElement) audioElement.pause();

      audioElement = new Audio(audioFile);
      audioElement.crossOrigin = "anonymous";

      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 512;
      analyser.smoothingTimeConstant = 0.85;

      sourceNode = audioContext.createMediaElementSource(audioElement);
      sourceNode.connect(analyser);
      analyser.connect(audioContext.destination);

      playPauseBtn.disabled = false;
      togglePlay(true);

      if (animationId) cancelAnimationFrame(animationId);
      drawVisualizer();
    }

    function togglePlay(forceState) {
      if (!audioElement) return;
      if (forceState !== undefined) isPlaying = forceState;
      else isPlaying = !isPlaying;

      if (isPlaying) {
        if (audioContext.state === 'suspended') audioContext.resume();
        audioElement.play();
        playIcon.textContent = '❚❚';
        playText.textContent = 'Pause';
      } else {
        audioElement.pause();
        playIcon.textContent = '▶';
        playText.textContent = 'Play';
      }
    }

    playPauseBtn.addEventListener('click', () => togglePlay());

    function drawVisualizer() {
      animationId = requestAnimationFrame(drawVisualizer);
      time += 0.03;

      const width = canvas.width;
      const height = canvas.height;

      // Heavy acid motion blur trail
      ctx.fillStyle = bgImage ? 'rgba(3, 0, 8, 0.25)' : 'rgba(5, 0, 12, 0.18)';
      ctx.fillRect(0, 0, width, height);

      if (bgImage) {
        ctx.save();
        ctx.globalAlpha = 0.4;
        ctx.drawImage(bgImage, 0, 0, width, height);
        ctx.restore();
      }

      if (!analyser) return;

      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      analyser.getByteTimeDomainData(dataArray);

      const freqArray = new Uint8Array(bufferLength);
      analyser.getByteFrequencyData(freqArray);

      let bass = 0;
      for (let i = 0; i < 12; i++) bass += freqArray[i];
      bass = bass / 12;

      ctx.save();
      if (bass > 200) {
        ctx.translate((Math.random() - 0.5) * (bass * 0.1), (Math.random() - 0.5) * (bass * 0.1));
      }

      const cx = width / 2;
      const cy = height / 2;

      switch(currentStyle) {
        case '1': // Acid Melt Wave
          {
            for (let l = 0; l < 6; l++) {
              ctx.beginPath();
              ctx.lineWidth = 6 + l * 2;
              const hue = (time * 40 + l * 50) % 360;
              ctx.strokeStyle = `hsl(${hue}, 100%, 60%)`;
              ctx.shadowBlur = 35;
              ctx.shadowColor = ctx.strokeStyle;

              const slice = width / bufferLength;
              for (let i = 0; i < bufferLength; i++) {
                const v = dataArray[i] / 128.0;
                const x = i * slice;
                const y = cy + Math.sin(time * 3 + i * 0.04 + l) * ((v - 1) * (height * 0.45)) + Math.cos(i * 0.02 - time * 2) * 80;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
              }
              ctx.stroke();
            }
          }
          break;

        case '2': // Hypno Kaleidoscope
          {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(time * 0.4);
            const petals = 8;
            for (let p = 0; p < petals; p++) {
              ctx.rotate((Math.PI * 2) / petals);
              ctx.beginPath();
              for (let i = 0; i < 60; i++) {
                const r = i * 14;
                const v = dataArray[i % bufferLength] / 128.0;
                const offset = Math.sin(time * 4 + i * 0.15) * ((v - 1) * 120);
                const x = r;
                const y = offset;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
              }
              ctx.strokeStyle = `hsl(${p * 45 + time * 30}, 100%, 65%)`;
              ctx.lineWidth = 5;
              ctx.shadowBlur = 25;
              ctx.shadowColor = ctx.strokeStyle;
              ctx.stroke();
            }
            ctx.restore();
          }
          break;

        case '3': // Liquid DMT Tunnel
          {
            ctx.save();
            ctx.translate(cx, cy);
            const rings = 16;
            for (let i = rings; i > 0; i--) {
              const r = ((time * 120 + i * 60) % (width * 0.7)) + (bass * 0.4);
              const alpha = Math.max(0, 1 - (r / (width * 0.7)));
              ctx.beginPath();
              ctx.arc(0, 0, r, 0, Math.PI * 2);
              ctx.strokeStyle = `hsla(${(i * 25 + time * 50) % 360}, 100%, 60%, ${alpha})`;
              ctx.lineWidth = 8 + (i * 1.5);
              ctx.shadowBlur = 30;
              ctx.shadowColor = `hsl(${(i * 25) % 360}, 100%, 60%)`;
              ctx.stroke();
            }
            ctx.restore();
          }
          break;

        case '4': // Psychedelic Mandalas
          {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(-time * 0.3);
            const layers = 7;
            for (let l = 1; l <= layers; l++) {
              ctx.beginPath();
              const radius = l * 65 + (bass * 0.3 * l);
              const points = 80;
              for (let i = 0; i < points; i++) {
                const angle = (i / points) * Math.PI * 2;
                const v = freqArray[i % bufferLength] / 255;
                const rad = radius + Math.sin(angle * 6 + time * 3) * (v * 70);
                const x = Math.cos(angle) * rad;
                const y = Math.sin(angle) * rad;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
              }
              ctx.closePath();
              ctx.strokeStyle = `hsl(${l * 50 + time * 20}, 100%, 65%)`;
              ctx.lineWidth = 4;
              ctx.shadowBlur = 20;
              ctx.shadowColor = ctx.strokeStyle;
              ctx.stroke();
            }
            ctx.restore();
          }
          break;

        case '5': // Electric Jellyfish
          {
            ctx.save();
            ctx.translate(cx, cy);
            const tentacles = 40;
            for (let i = 0; i < tentacles; i++) {
              const angle = (i / tentacles) * Math.PI * 2;
              ctx.beginPath();
              ctx.moveTo(0, 0);

              for (let j = 1; j < 25; j++) {
                const dist = j * 25;
                const v = freqArray[(i + j) % bufferLength] / 255;
                const wobble = Math.sin(time * 4 + j * 0.2 + i) * (v * 60);
                const x = Math.cos(angle + wobble * 0.01) * dist;
                const y = Math.sin(angle + wobble * 0.01) * dist;
                ctx.lineTo(x, y);
              }
              ctx.strokeStyle = `hsl(${i * 9 + time * 30}, 100%, 60%)`;
              ctx.lineWidth = 3;
              ctx.shadowBlur = 15;
              ctx.shadowColor = ctx.strokeStyle;
              ctx.stroke();
            }
            ctx.restore();
          }
          break;

        case '6': // Rainbow Liquid Mirror
          {
            ctx.save();
            ctx.translate(cx, cy);
            const slice = width / bufferLength;
            for (let l = 0; l < 2; l++) {
              ctx.beginPath();
              ctx.lineWidth = 7;
              ctx.strokeStyle = l === 0 ? '#ff00ea' : '#00ffff';
              ctx.shadowBlur = 30;
              ctx.shadowColor = ctx.strokeStyle;

              for (let i = 0; i < bufferLength; i++) {
                const v = dataArray[i] / 128.0;
                const x = (i - bufferLength / 2) * (slice * 1.5);
                const y = (l === 0 ? 1 : -1) * ((v - 1) * (height * 0.35) + Math.sin(time * 3 + i * 0.05) * 60);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
              }
              ctx.stroke();
            }
            ctx.restore();
          }
          break;

        case '7': // Cosmic Third Eye
          {
            ctx.save();
            ctx.translate(cx, cy);
            // Pulsing Eye Center
            const eyeR = 90 + (bass * 0.5);
            ctx.beginPath();
            ctx.arc(0, 0, eyeR, 0, Math.PI * 2);
            ctx.fillStyle = '#ff00ea';
            ctx.shadowBlur = 40;
            ctx.shadowColor = '#ff00ea';
            ctx.fill();

            // Radiating triangular/sacred geometry rays
            const rays = 24;
            for (let i = 0; i < rays; i++) {
              const angle = (i / rays) * Math.PI * 2 + (time * 0.2);
              const v = freqArray[i % bufferLength] / 255;
              const len = 300 + (v * 200);
              ctx.beginPath();
              ctx.moveTo(Math.cos(angle) * eyeR, Math.sin(angle) * eyeR);
              ctx.lineTo(Math.cos(angle) * len, Math.sin(angle) * len);
              ctx.strokeStyle = `hsl(${i * 15 + time * 40}, 100%, 60%)`;
              ctx.lineWidth = 4;
              ctx.shadowBlur = 20;
              ctx.shadowColor = ctx.strokeStyle;
              ctx.stroke();
            }
            ctx.restore();
          }
          break;

        case '8': // Morphing Plasma Web
          {
            ctx.save();
            ctx.translate(cx, cy);
            const nodes = 30;
            const pts = [];
            for (let i = 0; i < nodes; i++) {
              const angle = (i / nodes) * Math.PI * 2 + time;
              const v = freqArray[i % bufferLength] / 255;
              const r = 200 + Math.sin(time * 3 + i) * 100 + (v * 120);
              pts.push({ x: Math.cos(angle) * r, y: Math.sin(angle) * r });
            }

            for (let i = 0; i < pts.length; i++) {
              for (let j = i + 1; j < pts.length; j++) {
                const dist = Math.hypot(pts[i].x - pts[j].x, pts[i].y - pts[j].y);
                if (dist < 180) {
                  ctx.beginPath();
                  ctx.moveTo(pts[i].x, pts[i].y);
                  ctx.lineTo(pts[j].x, pts[j].y);
                  ctx.strokeStyle = `hsla(${(i * 12 + time * 30) % 360}, 100%, 60%, ${1 - (dist / 180)})`;
                  ctx.lineWidth = 2.5;
                  ctx.shadowBlur = 15;
                  ctx.shadowColor = '#ff00ea';
                  ctx.stroke();
                }
              }
            }
            ctx.restore();
          }
          break;

        case '9': // Infinite Ripple Void
          {
            ctx.save();
            ctx.translate(cx, cy);
            const ripples = 12;
            for (let i = 0; i < ripples; i++) {
              const r = ((time * 80 + i * 90) % (width * 0.65));
              const v = freqArray[i * 4 % bufferLength] / 255;
              ctx.beginPath();
              ctx.ellipse(0, 0, r, r * 0.5, time * 0.2, 0, Math.PI * 2);
              ctx.strokeStyle = `hsl(${i * 30 + time * 40}, 100%, 60%)`;
              ctx.lineWidth = 4 + (v * 8);
              ctx.shadowBlur = 25;
              ctx.shadowColor = ctx.strokeStyle;
              ctx.stroke();
            }
            ctx.restore();
          }
          break;

        case '10': // Stroboscopic Portal
          {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(time * 2);
            const count = 18;
            for (let i = 0; i < count; i++) {
              const angle = (i / count) * Math.PI * 2;
              const v = freqArray[i % bufferLength] / 255;
              const len = 350 + (v * 250);
              ctx.beginPath();
              ctx.moveTo(0, 0);
              ctx.lineTo(Math.cos(angle) * len, Math.sin(angle) * len);
              ctx.strokeStyle = `hsl(${i * 20 - time * 60}, 100%, 65%)`;
              ctx.lineWidth = 8;
              ctx.shadowBlur = 30;
              ctx.shadowColor = ctx.strokeStyle;
              ctx.stroke();
            }
            ctx.restore();
          }
          break;
      }
      ctx.restore();
    }

    exportBtn.addEventListener('click', async () => {
      if (!audioElement || !audioFile) {
        alert('Please load an audio file first!');
        return;
      }

      if (videoEncoder) {
        stopMp4Export();
        return;
      }

      if (audioContext.state === 'suspended') {
        await audioContext.resume();
      }

      audioElement.currentTime = 0;
      togglePlay(true);

      exportBtn.textContent = 'Initializing MP4 Export...';
      exportBtn.style.background = '#ff00ea';

      muxer = new Mp4Muxer.Muxer({
        target: new Mp4Muxer.ArrayBufferTarget(),
        video: { codec: 'avc', width: canvas.width, height: canvas.height },
        audio: { codec: 'aac', sampleRate: audioContext.sampleRate, numberOfChannels: 2 },
        fastStart: 'in-memory'
      });

      videoEncoder = new VideoEncoder({
        output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
        error: e => console.error('VideoEncoder error:', e)
      });

      videoEncoder.configure({
        codec: 'avc1.42001f',
        width: canvas.width,
        height: canvas.height,
        bitrate: 6_000_000,
        framerate: 30
      });

      const dest = audioContext.createMediaStreamDestination();
      sourceNode.connect(dest);

      audioEncoder = new AudioEncoder({
        output: (chunk, meta) => muxer.addAudioChunk(chunk, meta),
        error: e => console.error('AudioEncoder error:', e)
      });

      audioEncoder.configure({
        codec: 'mp4a.40.2',
        sampleRate: audioContext.sampleRate,
        numberOfChannels: 2,
        bitrate: 128_000
      });

      startTime = performance.now();
      let frameIndex = 0;
      const fps = 30;
      const intervalMs = 1000 / fps;

      exportBtn.textContent = 'Recording MP4... Click to Stop & Save';

      recordingInterval = setInterval(async () => {
        if (audioElement.ended) {
          stopMp4Export();
          return;
        }
        const timestamp = (performance.now() - startTime) * 1000;
        const frame = new VideoFrame(canvas, { timestamp });
        videoEncoder.encode(frame, { keyFrame: frameIndex % 60 === 0 });
        frame.close();
        frameIndex++;
      }, intervalMs);

      const processor = audioContext.createScriptProcessor(4096, 2, 2);
      sourceNode.connect(processor);
      processor.connect(audioContext.destination);

      processor.onaudioprocess = (e) => {
        if (!audioEncoder || audioEncoder.state === 'closed') return;
        const inputBuffer = e.inputBuffer;
        const audioData = new AudioData({
          format: 'f32-planar',
          sampleRate: inputBuffer.sampleRate,
          numberOfFrames: inputBuffer.length,
          numberOfChannels: 2,
          timestamp: (performance.now() - startTime) * 1000,
          data: [inputBuffer.getChannelData(0), inputBuffer.getChannelData(1)]
        });
        audioEncoder.encode(audioData);
        audioData.close();
      };

      window.activeAudioProcessor = processor;
    });

    async function stopMp4Export() {
      if (recordingInterval) clearInterval(recordingInterval);
      if (window.activeAudioProcessor) {
        window.activeAudioProcessor.disconnect();
        window.activeAudioProcessor = null;
      }

      if (videoEncoder) {
        await videoEncoder.flush();
        videoEncoder.close();
        videoEncoder = null;
      }

      if (audioEncoder) {
        await audioEncoder.flush();
        audioEncoder.close();
        audioEncoder = null;
      }

      if (muxer) {
        muxer.finalize();
        const buffer = muxer.target.buffer;
        const blob = new Blob([buffer], { type: 'video/mp4' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = 'vizzzual.mp4';
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          window.URL.revokeObjectURL(url);
        }, 100);
        muxer = null;
      }

      exportBtn.textContent = 'Export MP4 Video';
      exportBtn.style.background = 'var(--accent-color)';
    }
  </script>
</body>
</html>
