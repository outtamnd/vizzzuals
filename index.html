<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vizzzuals</title>
  <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.0/build/mp4-muxer.min.js"></script>
  <style>
    :root {
      --bg-color: #08080c;
      --card-bg: #121217;
      --accent-color: #7257ff;
      --accent-hover: #5d3eff;
      --text-main: #fffffe;
      --text-muted: #94a1b2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .app-container {
      width: 100%;
      max-width: 1200px;
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 30px;
    }

    .controls-panel {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      border: 1px solid #1e1e26;
      max-height: 90vh;
      overflow-y: auto;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.05em;
      color: var(--text-main);
    }

    .section-title {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .dropzone {
      border: 2px dashed #2a2a36;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      background: #0d0d12;
    }

    .dropzone:hover {
      border-color: var(--accent-color);
      background: #12121c;
    }

    .playback-bar {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .play-btn {
      flex: 1;
      padding: 12px;
      background: #20202d;
      border: 1px solid #323246;
      color: #fff;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .play-btn:hover {
      background: var(--accent-color);
      border-color: var(--accent-color);
    }

    .platform-selector {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .platform-btn, .style-btn {
      background: #181822;
      border: 1px solid #282836;
      color: var(--text-main);
      padding: 9px;
      border-radius: 8px;
      font-size: 0.75rem;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .platform-btn.active, .style-btn.active {
      background: var(--accent-color);
      border-color: var(--accent-color);
      box-shadow: 0 0 12px rgba(114, 87, 255, 0.4);
    }

    .styles-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    input[type="file"] {
      width: 100%;
      padding: 10px 12px;
      background: #0d0d12;
      border: 1px solid #222230;
      border-radius: 8px;
      color: #fff;
      outline: none;
      font-size: 0.9rem;
    }

    .preview-panel {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid #1e1e26;
      min-height: 500px;
    }

    .canvas-wrapper {
      max-width: 100%;
      max-height: 600px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 15px 40px rgba(0,0,0,0.7);
    }

    canvas {
      display: block;
      max-width: 100%;
      max-height: 550px;
      object-fit: contain;
    }

    .action-btn {
      width: 100%;
      padding: 14px;
      background: var(--accent-color);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .action-btn:hover {
      background: var(--accent-hover);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="controls-panel">
      <h1>vizzzuals</h1>

      <div>
        <div class="section-title">Audio File</div>
        <div class="dropzone" id="dropzone">
          <p style="font-size: 0.85rem; color: var(--text-muted);">Drag & drop audio or click</p>
          <input type="file" id="audioInput" accept="audio/*" style="display: none;">
        </div>
      </div>

      <div>
        <div class="section-title">Playback</div>
        <div class="playback-bar">
          <button class="play-btn" id="playPauseBtn" disabled>
            <span id="playIcon">▶</span> <span id="playText">Play</span>
          </button>
        </div>
      </div>

      <div>
        <div class="section-title">Platform Ratio</div>
        <div class="platform-selector">
          <button class="platform-btn active" data-ratio="9:16">Story (9:16)</button>
          <button class="platform-btn" data-ratio="1:1">Feed (1:1)</button>
          <button class="platform-btn" data-ratio="16:9">Wide (16:9)</button>
        </div>
      </div>

      <div>
        <div class="section-title">Visualizer Presets</div>
        <div class="styles-grid">
          <button class="style-btn active" data-style="1">1. Cyber Synthwave</button>
          <button class="style-btn" data-style="2">2. Hyperdrive Portal</button>
          <button class="style-btn" data-style="3">3. Neon Horizon</button>
          <button class="style-btn" data-style="4">4. Plasma Ribbon</button>
          <button class="style-btn" data-style="5">5. Vinyl Overdrive</button>
          <button class="style-btn" data-style="6">6. Cosmic Nebula</button>
          <button class="style-btn" data-style="7">7. 808 Shockwave</button>
          <button class="style-btn" data-style="8">8. Digital Matrix</button>
          <button class="style-btn" data-style="9">9. Spectral Helix</button>
          <button class="style-btn" data-style="10">10. Quantum Field</button>
        </div>
      </div>

      <div>
        <div class="section-title">Background Image (Optional)</div>
        <input type="file" id="bgInput" accept="image/*">
      </div>

      <button class="action-btn" id="exportBtn">Export MP4 Video</button>
    </div>

    <div class="preview-panel">
      <div class="canvas-wrapper">
        <canvas id="visualizerCanvas" width="1080" height="1920"></canvas>
      </div>
    </div>
  </div>

  <script>
    const dropzone = document.getElementById('dropzone');
    const audioInput = document.getElementById('audioInput');
    const bgInput = document.getElementById('bgInput');
    const canvas = document.getElementById('visualizerCanvas');
    const ctx = canvas.getContext('2d');
    const platformBtns = document.querySelectorAll('.platform-btn');
    const styleBtns = document.querySelectorAll('.style-btn');
    const exportBtn = document.getElementById('exportBtn');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon = document.getElementById('playIcon');
    const playText = document.getElementById('playText');

    let audioContext, audioElement, analyser, sourceNode;
    let audioFile = null;
    let bgImage = null;
    let isPlaying = false;
    let animationId = null;
    let muxer = null;
    let videoEncoder = null;
    let audioEncoder = null;
    let recordingInterval = null;
    let startTime = 0;
    let currentStyle = '1';

    let time = 0;
    let stars = [];
    let particles = [];
    let shockwaves = [];

    const ratios = {
      '9:16': { width: 1080, height: 1920 },
      '1:1':  { width: 1080, height: 1080 },
      '16:9': { width: 1920, height: 1080 }
    };
    let currentRatio = '9:16';

    platformBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        platformBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentRatio = btn.getAttribute('data-ratio');
        canvas.width = ratios[currentRatio].width;
        canvas.height = ratios[currentRatio].height;
        initParticles();
      });
    });

    styleBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        styleBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentStyle = btn.getAttribute('data-style');
      });
    });

    dropzone.addEventListener('click', () => audioInput.click());
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.style.borderColor = 'var(--accent-color)'; });
    dropzone.addEventListener('dragleave', () => { dropzone.style.borderColor = '#2a2a36'; });
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.style.borderColor = '#2a2a36';
      if (e.dataTransfer.files.length) handleAudioFile(e.dataTransfer.files[0]);
    });

    audioInput.addEventListener('change', (e) => {
      if (e.target.files.length) handleAudioFile(e.target.files[0]);
    });

    bgInput.addEventListener('change', (e) => {
      if (e.target.files.length) {
        const reader = new FileReader();
        reader.onload = (event) => {
          bgImage = new Image();
          bgImage.src = event.target.result;
        };
        reader.readAsDataURL(e.target.files[0]);
      }
    });

    function handleAudioFile(file) {
      audioFile = URL.createObjectURL(file);
      dropzone.querySelector('p').textContent = `Loaded: ${file.name}`;
      setupAudioContext();
    }

    function setupAudioContext() {
      if (audioElement) {
        audioElement.pause();
      }

      audioElement = new Audio(audioFile);
      audioElement.crossOrigin = "anonymous";

      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 512;
      analyser.smoothingTimeConstant = 0.82;

      sourceNode = audioContext.createMediaElementSource(audioElement);
      sourceNode.connect(analyser);
      analyser.connect(audioContext.destination);

      playPauseBtn.disabled = false;
      togglePlay(true);

      initParticles();

      if (animationId) cancelAnimationFrame(animationId);
      drawVisualizer();
    }

    function togglePlay(forceState) {
      if (!audioElement) return;

      if (forceState !== undefined) {
        isPlaying = forceState;
      } else {
        isPlaying = !isPlaying;
      }

      if (isPlaying) {
        if (audioContext.state === 'suspended') {
          audioContext.resume();
        }
        audioElement.play();
        playIcon.textContent = '❚❚';
        playText.textContent = 'Pause';
      } else {
        audioElement.pause();
        playIcon.textContent = '▶';
        playText.textContent = 'Play';
      }
    }

    playPauseBtn.addEventListener('click', () => togglePlay());

    function initParticles() {
      stars = [];
      particles = [];
      for (let i = 0; i < 150; i++) {
        stars.push({
          x: (Math.random() - 0.5) * canvas.width * 2,
          y: (Math.random() - 0.5) * canvas.height * 2,
          z: Math.random() * canvas.width,
          size: Math.random() * 2 + 1
        });
      }
      for (let i = 0; i < 100; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 3,
          vy: (Math.random() - 0.5) * 3,
          radius: Math.random() * 4 + 2,
          hue: Math.random() * 360
        });
      }
    }

    function drawVisualizer() {
      animationId = requestAnimationFrame(drawVisualizer);
      time += 0.015;

      const width = canvas.width;
      const height = canvas.height;

      ctx.fillStyle = bgImage ? 'rgba(5, 5, 8, 0.45)' : 'rgba(8, 8, 12, 0.35)';
      ctx.fillRect(0, 0, width, height);

      if (bgImage) {
        ctx.save();
        ctx.globalAlpha = 0.35;
        ctx.drawImage(bgImage, 0, 0, width, height);
        ctx.restore();
      }

      if (!analyser) return;

      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      analyser.getByteFrequencyData(dataArray);

      let bass = 0, mid = 0, treble = 0;
      for (let i = 0; i < 12; i++) bass += dataArray[i];
      for (let i = 12; i < 80; i++) mid += dataArray[i];
      for (let i = 80; i < bufferLength; i++) treble += dataArray[i];

      bass = bass / 12;
      mid = mid / 68;
      treble = treble / (bufferLength - 80);

      ctx.save();
      if (bass > 210) {
        const shakeX = (Math.random() - 0.5) * (bass * 0.08);
        const shakeY = (Math.random() - 0.5) * (bass * 0.08);
        ctx.translate(shakeX, shakeY);
      }

      switch(currentStyle) {
        case '1':
          {
            const horizon = height * 0.6;
            const sunR = 140 + (bass * 0.4);
            const sunG = ctx.createRadialGradient(width/2, horizon - 50, 10, width/2, horizon - 50, sunR);
            sunG.addColorStop(0, '#ff9f43');
            sunG.addColorStop(0.5, '#ee5253');
            sunG.addColorStop(1, 'rgba(238, 82, 83, 0)');
            ctx.fillStyle = sunG;
            ctx.beginPath();
            ctx.arc(width/2, horizon - 50, sunR, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#00d2d3';
            ctx.lineWidth = 2;
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#00d2d3';
            const speed = (time * 150) % 60;

            for (let y = horizon; y < height; y += 25) {
              const pY = y + (speed * ((y - horizon) / (height - horizon)));
              ctx.beginPath();
              ctx.moveTo(0, pY);
              ctx.lineTo(width, pY);
              ctx.stroke();
            }

            for (let x = -width; x < width * 2; x += 100) {
              ctx.beginPath();
              ctx.moveTo(x, height);
              ctx.lineTo(width/2 + (x - width/2) * 0.1, horizon);
              ctx.stroke();
            }

            const bars = 64;
            const bWidth = width / bars;
            for (let i = 0; i < bars; i++) {
              const val = dataArray[i * 2] / 255;
              const h = val * (height * 0.28);
              ctx.fillStyle = `hsl(${280 + (i * 2)}, 100%, 65%)`;
              ctx.shadowBlur = 15;
              ctx.shadowColor = `hsl(${280 + (i * 2)}, 100%, 65%)`;
              ctx.fillRect(i * bWidth, horizon - h, bWidth - 3, h);
            }
          }
          break;

        case '2':
          {
            const cx = width / 2;
            const cy = height / 2;

            stars.forEach((s) => {
              s.z -= 4 + (bass * 0.12);
              if (s.z <= 0) {
                s.z = width;
                s.x = (Math.random() - 0.5) * width * 2;
                s.y = (Math.random() - 0.5) * height * 2;
              }

              const k = 400 / s.z;
              const px = s.x * k + cx;
              const py = s.y * k + cy;

              if (px >= 0 && px < width && py >= 0 && py < height) {
                const size = Math.max(1, (1 - s.z / width) * 6 + (bass * 0.03));
                ctx.fillStyle = `hsl(${200 + (s.z * 0.2)}, 100%, 75%)`;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#7257ff';
                ctx.beginPath();
                ctx.arc(px, py, size, 0, Math.PI * 2);
                ctx.fill();
              }
            });

            const r = 160 + (bass * 0.8);
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.strokeStyle = '#7257ff';
            ctx.lineWidth = 8;
            ctx.shadowBlur = 30;
            ctx.shadowColor = '#7257ff';
            ctx.stroke();
          }
          break;

        case '3':
          {
            const cy = height / 2;
            ctx.lineWidth = 5;
            ctx.shadowBlur = 20;

            for (let layer = 0; layer < 3; layer++) {
              ctx.beginPath();
              const color = layer === 0 ? '#ff4757' : layer === 1 ? '#7257ff' : '#00d2d3';
              ctx.strokeStyle = color;
              ctx.shadowColor = color;

              for (let i = 0; i < width; i += 10) {
                const idx = Math.floor((i / width) * bufferLength);
                const amp = (dataArray[idx] / 255) * (height * 0.22);
                const y = cy + Math.sin(time * 3 + (i * 0.01) + layer) * 80 + (layer % 2 === 0 ? amp : -amp);
                if (i === 0) ctx.moveTo(i, y);
                else ctx.lineTo(i, y);
              }
              ctx.stroke();
            }
          }
          break;

        case '4':
          {
            ctx.beginPath();
            const points = 80;
            const step = width / points;
            for (let i = 0; i <= points; i++) {
              const idx = Math.floor((i / points) * (bufferLength / 2));
              const amp = (dataArray[idx] / 255) * (height * 0.3);
              const x = i * step;
              const y = (height / 2) + Math.sin(time * 2 + i * 0.1) * 120 + Math.cos(i * 0.2) * amp;

              if (i === 0) ctx.moveTo(x, y);
              else ctx.quadraticCurveTo(x - step/2, y + (amp * 0.5), x, y);
            }
            ctx.strokeStyle = `hsl(${(time * 50) % 360}, 100%, 65%)`;
            ctx.lineWidth = 10;
            ctx.shadowBlur = 25;
            ctx.shadowColor = `hsl(${(time * 50) % 360}, 100%, 65%)`;
            ctx.stroke();
          }
          break;

        case '5':
          {
            const cx = width / 2;
            const cy = height / 2;
            const r = 240 + (bass * 0.3);

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(time * 0.8);

            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.fillStyle = '#0f0f14';
            ctx.shadowBlur = 35;
            ctx.shadowColor = '#7257ff';
            ctx.fill();
            ctx.lineWidth = 6;
            ctx.strokeStyle = '#2a2a38';
            ctx.stroke();

            const count = 72;
            for (let i = 0; i < count; i++) {
              const angle = (i / count) * Math.PI * 2;
              const len = (dataArray[i * 2] / 255) * 140;
              ctx.strokeStyle = `hsl(${i * 5}, 100%, 60%)`;
              ctx.lineWidth = 4;
              ctx.beginPath();
              ctx.moveTo(Math.cos(angle) * r, Math.sin(angle) * r);
              ctx.lineTo(Math.cos(angle) * (r + len), Math.sin(angle) * (r + len));
              ctx.stroke();
            }

            ctx.beginPath();
            ctx.arc(0, 0, 75, 0, Math.PI * 2);
            ctx.fillStyle = '#7257ff';
            ctx.fill();
            ctx.restore();
          }
          break;

        case '6':
          {
            particles.forEach((p, i) => {
              const energy = dataArray[i % bufferLength] / 255;
              p.x += p.vx * (1 + energy * 5);
              p.y += p.vy * (1 + energy * 5);

              if (p.x < 0 || p.x > width) p.vx *= -1;
              if (p.y < 0 || p.y > height) p.vy *= -1;

              ctx.beginPath();
              ctx.arc(p.x, p.y, p.radius + (energy * 12), 0, Math.PI * 2);
              ctx.fillStyle = `hsl(${(p.hue + time * 20) % 360}, 100%, 65%)`;
              ctx.shadowBlur = 20;
              ctx.shadowColor = `hsl(${(p.hue + time * 20) % 360}, 100%, 65%)`;
              ctx.fill();
            });
          }
          break;

        case '7':
          {
            const cx = width / 2;
            const cy = height / 2;

            if (bass > 210) {
              shockwaves.push({ r: 50, alpha: 1, color: `hsl(${Math.random() * 360}, 100%, 60%)` });
            }

            shockwaves.forEach((sw, idx) => {
              sw.r += 18;
              sw.alpha -= 0.02;
              ctx.beginPath();
              ctx.arc(cx, cy, sw.r, 0, Math.PI * 2);
              ctx.strokeStyle = sw.color;
              ctx.globalAlpha = Math.max(0, sw.alpha);
              ctx.lineWidth = 8;
              ctx.shadowBlur = 20;
              ctx.shadowColor = sw.color;
              ctx.stroke();
              ctx.globalAlpha = 1;
              if (sw.alpha <= 0) shockwaves.splice(idx, 1);
            });

            ctx.beginPath();
            ctx.arc(cx, cy, 80 + (bass * 0.6), 0, Math.PI * 2);
            ctx.fillStyle = '#ff4757';
            ctx.shadowBlur = 30;
            ctx.shadowColor = '#ff4757';
            ctx.fill();
          }
          break;

        case '8':
          {
            ctx.fillStyle = '#00ff66';
            ctx.font = 'bold 22px monospace';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#00ff66';

            const cols = 40;
            const colW = width / cols;
            for (let i = 0; i < cols; i++) {
              const val = dataArray[i * 4] / 255;
              const y = ((time * 300 + (i * 90)) % height);
              const char = String.fromCharCode(0x30A0 + Math.floor(Math.random() * 96));
              ctx.fillText(char, i * colW, y);
              if (val > 0.6) {
                ctx.fillStyle = '#ffffff';
                ctx.fillText(char, i * colW, y + 25);
                ctx.fillStyle = '#00ff66';
              }
            }
          }
          break;

        case '9':
          {
            const cx = width / 2;
            for (let i = 0; i < 60; i++) {
              const y = (i / 60) * height;
              const val = dataArray[i * 3] / 255;
              const offset = Math.sin(time * 3 + i * 0.15) * (180 + (val * 120));

              ctx.fillStyle = '#2ed573';
              ctx.shadowBlur = 15;
              ctx.shadowColor = '#2ed573';
              ctx.beginPath();
              ctx.arc(cx + offset, y, 7 + (val * 8), 0, Math.PI * 2);
              ctx.fill();

              ctx.fillStyle = '#ff4757';
              ctx.shadowColor = '#ff4757';
              ctx.beginPath();
              ctx.arc(cx - offset, y, 7 + (val * 8), 0, Math.PI * 2);
              ctx.fill();

              ctx.strokeStyle = 'rgba(255,255,255,0.15)';
              ctx.beginPath();
              ctx.moveTo(cx + offset, y);
              ctx.lineTo(cx - offset, y);
              ctx.stroke();
            }
          }
          break;

        case '10':
          {
            const cx = width / 2;
            const cy = height / 2;
            const points = 100;
            ctx.save();
            ctx.translate(cx, cy);

            for (let i = 0; i < points; i++) {
              const angle = (i / points) * Math.PI * 2;
              const val = dataArray[i % bufferLength] / 255;
              const r = 220 + Math.sin(time * 4 + i * 0.2) * 40 + (val * 160);
              const x = Math.cos(angle) * r;
              const y = Math.sin(angle) * r;

              ctx.fillStyle = `hsl(${(i * 3 + time * 40) % 360}, 100%, 65%)`;
              ctx.shadowBlur = 15;
              ctx.shadowColor = `hsl(${(i * 3 + time * 40) % 360}, 100%, 65%)`;
              ctx.beginPath();
              ctx.arc(x, y, 6 + (val * 10), 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.restore();
          }
          break;
      }
      ctx.restore();
    }

    exportBtn.addEventListener('click', async () => {
      if (!audioElement || !audioFile) {
        alert('Please load an audio file first!');
        return;
      }

      if (videoEncoder) {
        stopMp4Export();
        return;
      }

      if (audioContext.state === 'suspended') {
        await audioContext.resume();
      }

      audioElement.currentTime = 0;
      togglePlay(true);

      exportBtn.textContent = 'Initializing MP4 Export...';
      exportBtn.style.background = '#ff4757';

      muxer = new Mp4Muxer.Muxer({
        target: new Mp4Muxer.ArrayBufferTarget(),
        video: { codec: 'avc', width: canvas.width, height: canvas.height },
        audio: { codec: 'aac', sampleRate: audioContext.sampleRate, numberOfChannels: 2 },
        fastStart: 'in-memory'
      });

      videoEncoder = new VideoEncoder({
        output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
        error: e => console.error('VideoEncoder error:', e)
      });

      videoEncoder.configure({
        codec: 'avc1.42001f',
        width: canvas.width,
        height: canvas.height,
        bitrate: 6_000_000,
        framerate: 30
      });

      const dest = audioContext.createMediaStreamDestination();
      sourceNode.connect(dest);

      audioEncoder = new AudioEncoder({
        output: (chunk, meta) => muxer.addAudioChunk(chunk, meta),
        error: e => console.error('AudioEncoder error:', e)
      });

      audioEncoder.configure({
        codec: 'mp4a.40.2',
        sampleRate: audioContext.sampleRate,
        numberOfChannels: 2,
        bitrate: 128_000
      });

      startTime = performance.now();
      let frameIndex = 0;
      const fps = 30;
      const intervalMs = 1000 / fps;

      exportBtn.textContent = 'Recording MP4... Click to Stop & Save';

      recordingInterval = setInterval(async () => {
        if (audioElement.ended) {
          stopMp4Export();
          return;
        }
        const timestamp = (performance.now() - startTime) * 1000;
        const frame = new VideoFrame(canvas, { timestamp });
        videoEncoder.encode(frame, { keyFrame: frameIndex % 60 === 0 });
        frame.close();
        frameIndex++;
      }, intervalMs);

      const processor = audioContext.createScriptProcessor(4096, 2, 2);
      sourceNode.connect(processor);
      processor.connect(audioContext.destination);

      processor.onaudioprocess = (e) => {
        if (!audioEncoder || audioEncoder.state === 'closed') return;
        const inputBuffer = e.inputBuffer;
        const audioData = new AudioData({
          format: 'f32-planar',
          sampleRate: inputBuffer.sampleRate,
          numberOfFrames: inputBuffer.length,
          numberOfChannels: 2,
          timestamp: (performance.now() - startTime) * 1000,
          data: [inputBuffer.getChannelData(0), inputBuffer.getChannelData(1)]
        });
        audioEncoder.encode(audioData);
        audioData.close();
      };

      window.activeAudioProcessor = processor;
    });

    async function stopMp4Export() {
      if (recordingInterval) clearInterval(recordingInterval);
      if (window.activeAudioProcessor) {
        window.activeAudioProcessor.disconnect();
        window.activeAudioProcessor = null;
      }

      if (videoEncoder) {
        await videoEncoder.flush();
        videoEncoder.close();
        videoEncoder = null;
      }

      if (audioEncoder) {
        await audioEncoder.flush();
        audioEncoder.close();
        audioEncoder = null;
      }

      if (muxer) {
        muxer.finalize();
        const buffer = muxer.target.buffer;
        const blob = new Blob([buffer], { type: 'video/mp4' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = 'vizzzual.mp4';
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          window.URL.revokeObjectURL(url);
        }, 100);
        muxer = null;
      }

      exportBtn.textContent = 'Export MP4 Video';
      exportBtn.style.background = 'var(--accent-color)';
    }
  </script>
</body>
</html>
