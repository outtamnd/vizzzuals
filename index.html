<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vizzzuals</title>
  <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.0/build/mp4-muxer.min.js"></script>
  <style>
    :root {
      --bg-color: #050508;
      --card-bg: #0e0e12;
      --accent-color: #ff2a5f;
      --accent-hover: #e01b4d;
      --text-main: #fffffe;
      --text-muted: #8a8a9e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .app-container {
      width: 100%;
      max-width: 1250px;
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 30px;
    }

    .controls-panel {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      border: 1px solid #1a1a24;
      max-height: 90vh;
      overflow-y: auto;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.05em;
      color: var(--text-main);
    }

    .section-title {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .dropzone {
      border: 2px dashed #222230;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      background: #09090e;
    }

    .dropzone:hover {
      border-color: var(--accent-color);
      background: #0f0f17;
    }

    .playback-bar {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .play-btn {
      flex: 1;
      padding: 12px;
      background: #181824;
      border: 1px solid #28283a;
      color: #fff;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .play-btn:hover {
      background: var(--accent-color);
      border-color: var(--accent-color);
    }

    .platform-selector {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .platform-btn, .style-btn {
      background: #13131c;
      border: 1px solid #222230;
      color: var(--text-main);
      padding: 9px;
      border-radius: 8px;
      font-size: 0.75rem;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .platform-btn.active, .style-btn.active {
      background: var(--accent-color);
      border-color: var(--accent-color);
      box-shadow: 0 0 15px rgba(255, 42, 95, 0.4);
    }

    .styles-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    input[type="file"] {
      display: none;
    }

    .preview-panel {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid #1a1a24;
      min-height: 500px;
    }

    .canvas-wrapper {
      max-width: 100%;
      max-height: 600px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }

    canvas {
      display: block;
      max-width: 100%;
      max-height: 550px;
      object-fit: contain;
    }

    .action-btn {
      width: 100%;
      padding: 14px;
      background: var(--accent-color);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .action-btn:hover {
      background: var(--accent-hover);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="controls-panel">
      <h1>vizzzuals</h1>

      <div>
        <div class="section-title">Audio File</div>
        <div class="dropzone" id="dropzone">
          <p style="font-size: 0.85rem; color: var(--text-muted);">Drag & drop audio or click</p>
          <input type="file" id="audioInput" accept="audio/*">
        </div>
      </div>

      <div>
        <div class="section-title">Playback</div>
        <div class="playback-bar">
          <button class="play-btn" id="playPauseBtn" disabled>
            <span id="playIcon">▶</span> <span id="playText">Play</span>
          </button>
        </div>
      </div>

      <div>
        <div class="section-title">Platform Ratio</div>
        <div class="platform-selector">
          <button class="platform-btn active" data-ratio="9:16">Story (9:16)</button>
          <button class="platform-btn" data-ratio="1:1">Feed (1:1)</button>
          <button class="platform-btn" data-ratio="16:9">Wide (16:9)</button>
        </div>
      </div>

      <div>
        <div class="section-title">Avant-Garde Custom Presets</div>
        <div class="styles-grid">
          <button class="style-btn active" data-style="1">1. Liquid Ferrofluid</button>
          <button class="style-btn" data-style="2">2. Audio Black Hole</button>
          <button class="style-btn" data-style="3">3. Glitch VCR Core</button>
          <button class="style-btn" data-style="4">4. Acid Liquid Plasma</button>
          <button class="style-btn" data-style="5">5. Sub-Bass Seismograph</button>
          <button class="style-btn" data-style="6">6. Laser Wireframe Warp</button>
          <button class="style-btn" data-style="7">7. Cellular Bismuth</button>
          <button class="style-btn" data-style="8">8. Cyberpunk Distortion</button>
          <button class="style-btn" data-style="9">9. Fractal Kaleidoscope</button>
          <button class="style-btn" data-style="10">10. Void Particle Singularity</button>
        </div>
      </div>

      <div>
        <div class="section-title">Background Image (Optional)</div>
        <input type="file" id="bgInput" accept="image/*" style="display:block;">
      </div>

      <button class="action-btn" id="exportBtn">Export MP4 Video</button>
    </div>

    <div class="preview-panel">
      <div class="canvas-wrapper">
        <canvas id="visualizerCanvas" width="1080" height="1920"></canvas>
      </div>
    </div>
  </div>

  <script>
    const dropzone = document.getElementById('dropzone');
    const audioInput = document.getElementById('audioInput');
    const bgInput = document.getElementById('bgInput');
    const canvas = document.getElementById('visualizerCanvas');
    const ctx = canvas.getContext('2d');
    const platformBtns = document.querySelectorAll('.platform-btn');
    const styleBtns = document.querySelectorAll('.style-btn');
    const exportBtn = document.getElementById('exportBtn');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon = document.getElementById('playIcon');
    const playText = document.getElementById('playText');

    let audioContext, audioElement, analyser, sourceNode;
    let audioFile = null;
    let bgImage = null;
    let isPlaying = false;
    let animationId = null;
    let muxer = null;
    let videoEncoder = null;
    let audioEncoder = null;
    let recordingInterval = null;
    let startTime = 0;
    let currentStyle = '1';

    let time = 0;
    let particles = [];
    let glitchLines = [];

    const ratios = {
      '9:16': { width: 1080, height: 1920 },
      '1:1':  { width: 1080, height: 1080 },
      '16:9': { width: 1920, height: 1080 }
    };
    let currentRatio = '9:16';

    platformBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        platformBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentRatio = btn.getAttribute('data-ratio');
        canvas.width = ratios[currentRatio].width;
        canvas.height = ratios[currentRatio].height;
        initEngine();
      });
    });

    styleBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        styleBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentStyle = btn.getAttribute('data-style');
      });
    });

    dropzone.addEventListener('click', () => audioInput.click());
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.style.borderColor = 'var(--accent-color)'; });
    dropzone.addEventListener('dragleave', () => { dropzone.style.borderColor = '#222230'; });
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.style.borderColor = '#222230';
      if (e.dataTransfer.files.length) handleAudioFile(e.dataTransfer.files[0]);
    });

    audioInput.addEventListener('change', (e) => {
      if (e.target.files.length) handleAudioFile(e.target.files[0]);
    });

    bgInput.addEventListener('change', (e) => {
      if (e.target.files.length) {
        const reader = new FileReader();
        reader.onload = (event) => {
          bgImage = new Image();
          bgImage.src = event.target.result;
        };
        reader.readAsDataURL(e.target.files[0]);
      }
    });

    function handleAudioFile(file) {
      audioFile = URL.createObjectURL(file);
      dropzone.querySelector('p').textContent = `Loaded: ${file.name}`;
      setupAudioContext();
    }

    function setupAudioContext() {
      if (audioElement) audioElement.pause();

      audioElement = new Audio(audioFile);
      audioElement.crossOrigin = "anonymous";

      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 256;
      analyser.smoothingTimeConstant = 0.85;

      sourceNode = audioContext.createMediaElementSource(audioElement);
      sourceNode.connect(analyser);
      analyser.connect(audioContext.destination);

      playPauseBtn.disabled = false;
      togglePlay(true);
      initEngine();

      if (animationId) cancelAnimationFrame(animationId);
      drawVisualizer();
    }

    function togglePlay(forceState) {
      if (!audioElement) return;
      if (forceState !== undefined) isPlaying = forceState;
      else isPlaying = !isPlaying;

      if (isPlaying) {
        if (audioContext.state === 'suspended') audioContext.resume();
        audioElement.play();
        playIcon.textContent = '❚❚';
        playText.textContent = 'Pause';
      } else {
        audioElement.pause();
        playIcon.textContent = '▶';
        playText.textContent = 'Play';
      }
    }

    playPauseBtn.addEventListener('click', () => togglePlay());

    function initEngine() {
      particles = [];
      for (let i = 0; i < 200; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          angle: Math.random() * Math.PI * 2,
          speed: Math.random() * 2 + 0.5,
          size: Math.random() * 3 + 1
        });
      }
    }

    function drawVisualizer() {
      animationId = requestAnimationFrame(drawVisualizer);
      time += 0.02;

      const width = canvas.width;
      const height = canvas.height;

      // Heavy feedback blur/trail
      ctx.fillStyle = bgImage ? 'rgba(5, 5, 8, 0.3)' : 'rgba(3, 3, 5, 0.25)';
      ctx.fillRect(0, 0, width, height);

      if (bgImage) {
        ctx.save();
        ctx.globalAlpha = 0.4;
        ctx.drawImage(bgImage, 0, 0, width, height);
        ctx.restore();
      }

      if (!analyser) return;

      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      analyser.getByteFrequencyData(dataArray);

      let bass = 0;
      for (let i = 0; i < 8; i++) bass += dataArray[i];
      bass = bass / 8;

      ctx.save();
      if (bass > 200) {
        ctx.translate((Math.random() - 0.5) * 14, (Math.random() - 0.5) * 14);
      }

      const cx = width / 2;
      const cy = height / 2;

      switch(currentStyle) {
        case '1': // 1. Liquid Ferrofluid (Organic morphing blob reacting to frequencies)
          {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.beginPath();
            const points = 120;
            const radius = 250 + (bass * 0.6);

            for (let i = 0; i < points; i++) {
              const angle = (i / points) * Math.PI * 2;
              const wave = Math.sin(angle * 6 + time * 3) * 30 + Math.cos(angle * 4 - time * 2) * ((dataArray[i % bufferLength] / 255) * 120);
              const r = radius + wave;
              const x = Math.cos(angle) * r;
              const y = Math.sin(angle) * r;
              if (i === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            }
            ctx.closePath();
            const grad = ctx.createRadialGradient(0, 0, 50, 0, 0, 400);
            grad.addColorStop(0, '#ff2a5f');
            grad.addColorStop(0.5, '#7257ff');
            grad.addColorStop(1, '#00d2d3');
            ctx.fillStyle = grad;
            ctx.shadowBlur = 40;
            ctx.shadowColor = '#ff2a5f';
            ctx.fill();
            ctx.restore();
          }
          break;

        case '2': // 2. Audio Black Hole (Gravitational lensing light warp rings)
          {
            const rings = 18;
            for (let i = 0; i < rings; i++) {
              const r = (i * 45) + ((time * 60) % 45) + (bass * 0.4);
              const alpha = Math.max(0, 1 - (r / (width * 0.6)));
              ctx.beginPath();
              ctx.arc(cx, cy, r, 0, Math.PI * 2);
              ctx.strokeStyle = `rgba(255, 42, 95, ${alpha})`;
              ctx.lineWidth = 3 + ((i / rings) * 6);
              ctx.shadowBlur = 25;
              ctx.shadowColor = '#ff2a5f';
              ctx.stroke();
            }
          }
          break;

        case '3': // 3. Glitch VCR Core (Analog data corruption scanline warp)
          {
            ctx.lineWidth = 4;
            ctx.beginPath();
            for (let i = 0; i < width; i += 6) {
              const idx = Math.floor((i / width) * bufferLength);
              const amp = (dataArray[idx] / 255) * (height * 0.35);
              const glitchOffset = (Math.random() > 0.92) ? (Math.random() - 0.5) * 100 : 0;
              const x = i + glitchOffset;
              const y = cy + Math.sin(time * 5 + i * 0.02) * 120 + ((i % 2 === 0) ? amp : -amp);
              if (i === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            }
            ctx.strokeStyle = '#00ffcc';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#00ffcc';
            ctx.stroke();
          }
          break;

        case '4': // 4. Acid Liquid Plasma (Sinuous multi-colored fluid ribbons)
          {
            for (let l = 0; l < 5; l++) {
              ctx.beginPath();
              for (let x = 0; x < width; x += 15) {
                const idx = Math.floor((x / width) * bufferLength);
                const val = dataArray[idx] / 255;
                const y = cy + Math.sin(time * 2 + x * 0.01 + l) * (150 + l * 40) + Math.cos(x * 0.005 - time * 3) * (val * 300);
                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
              }
              ctx.strokeStyle = `hsl(${(l * 70 + time * 50) % 360}, 100%, 60%)`;
              ctx.lineWidth = 6;
              ctx.shadowBlur = 25;
              ctx.shadowColor = ctx.strokeStyle;
              ctx.stroke();
            }
          }
          break;

        case '5': // 5. Sub-Bass Seismograph (Raw oscilloscope vibration sweep)
          {
            ctx.lineWidth = 5;
            ctx.beginPath();
            const slice = width / bufferLength;
            for (let i = 0; i < bufferLength; i++) {
              const x = i * slice;
              const v = dataArray[i] / 128.0;
              const y = cy + (v - 1) * (height * 0.45) + Math.sin(time * 10 + i) * (bass * 0.2);
              if (i === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            }
            ctx.strokeStyle = '#ff0055';
            ctx.shadowBlur = 30;
            ctx.shadowColor = '#ff0055';
            ctx.stroke();
          }
          break;

        case '6': // 6. Laser Wireframe Warp (3D Geometric Tunnel Grid)
          {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(time * 0.5);
            const sides = 8;
            const maxR = width * 0.6;
            for (let j = 1; j < 10; j++) {
              const r = ((time * 100 + j * 70) % maxR) + (bass * 0.3);
              const alpha = Math.max(0, 1 - (r / maxR));
              ctx.beginPath();
              for (let i = 0; i <= sides; i++) {
                const angle = (i * Math.PI * 2) / sides;
                const x = Math.cos(angle) * r;
                const y = Math.sin(angle) * r;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
              }
              ctx.closePath();
              ctx.strokeStyle = `rgba(0, 210, 211, ${alpha})`;
              ctx.lineWidth = 4;
              ctx.shadowBlur = 15;
              ctx.shadowColor = '#00d2d3';
              ctx.stroke();
            }
            ctx.restore();
          }
          break;

        case '7': // 7. Cellular Bismuth (Voronoi shifting crystalline node web)
          {
            particles.forEach((p, index) => {
              const energy = dataArray[index % bufferLength] / 255;
              p.x += Math.cos(p.angle) * (p.speed + energy * 6);
              p.y += Math.sin(p.angle) * (p.speed + energy * 6);

              if (p.x < 0) p.x = width;
              if (p.x > width) p.x = 0;
              if (p.y < 0) p.y = height;
              if (p.y > height) p.y = 0;

              ctx.beginPath();
              ctx.arc(p.x, p.y, p.size + (energy * 8), 0, Math.PI * 2);
              ctx.fillStyle = `hsl(${index * 15 + time * 30}, 100%, 65%)`;
              ctx.shadowBlur = 15;
              ctx.shadowColor = ctx.fillStyle;
              ctx.fill();

              // Connect nodes
              for (let j = index + 1; j < index + 5; j++) {
                const p2 = particles[j % particles.length];
                const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                if (dist < 140) {
                  ctx.beginPath();
                  ctx.moveTo(p.x, p.y);
                  ctx.lineTo(p2.x, p2.y);
                  ctx.strokeStyle = `rgba(255, 42, 95, ${1 - (dist / 140)})`;
                  ctx.lineWidth = 1.5;
                  ctx.stroke();
                }
              }
            });
          }
          break;

        case '8': // 8. Cyberpunk Distortion (Neon cyber spikes & data arrays)
          {
            const bars = 48;
            const bWidth = width / bars;
            for (let i = 0; i < bars; i++) {
              const val = dataArray[i * 2] / 255;
              const h = val * (height * 0.5);
              const x = i * bWidth;

              ctx.fillStyle = `hsl(${i * 8}, 100%, 55%)`;
              ctx.shadowBlur = 20;
              ctx.shadowColor = ctx.fillStyle;

              // Top and bottom mirrored spiking columns
              ctx.fillRect(x + 4, 0, bWidth - 8, h);
              ctx.fillRect(x + 4, height - h, bWidth - 8, h);
            }
          }
          break;

        case '9': // 9. Fractal Kaleidoscope (Rotational mirror symmetry)
          {
            ctx.save();
            ctx.translate(cx, cy);
            const petals = 12;
            for (let p = 0; p < petals; p++) {
              ctx.rotate((Math.PI * 2) / petals);
              ctx.beginPath();
              for (let i = 0; i < 40; i++) {
                const r = i * 15;
                const idx = i % bufferLength;
                const offset = Math.sin(time * 3 + i * 0.2) * ((dataArray[idx] / 255) * 50);
                const x = r;
                const y = offset;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
              }
              ctx.strokeStyle = `hsl(${(p * 30 + time * 20) % 360}, 100%, 60%)`;
              ctx.lineWidth = 4;
              ctx.shadowBlur = 20;
              ctx.shadowColor = ctx.strokeStyle;
              ctx.stroke();
            }
            ctx.restore();
          }
          break;

        case '10': // 10. Void Particle Singularity (Explosive central event horizon vortex)
          {
            particles.forEach((p, i) => {
              const energy = dataArray[i % bufferLength] / 255;
              const dx = cx - p.x;
              const dy = cy - p.y;
              const dist = Math.hypot(dx, dy);
              const angle = Math.atan2(dy, dx);

              p.x += Math.cos(angle) * (2 + energy * 10) - Math.sin(angle) * 3;
              p.y += Math.sin(angle) * (2 + energy * 10) + Math.cos(angle) * 3;

              if (dist < 30 || p.x < 0 || p.x > width || p.y < 0 || p.y > height) {
                p.x = cx + (Math.random() - 0.5) * width;
                p.y = cy + (Math.random() - 0.5) * height;
              }

              ctx.beginPath();
              ctx.arc(p.x, p.y, p.size + (energy * 6), 0, Math.PI * 2);
              ctx.fillStyle = '#ffffff';
              ctx.shadowBlur = 12;
              ctx.shadowColor = '#ff2a5f';
              ctx.fill();
            });
          }
          break;
      }
      ctx.restore();
    }

    exportBtn.addEventListener('click', async () => {
      if (!audioElement || !audioFile) {
        alert('Please load an audio file first!');
        return;
      }

      if (videoEncoder) {
        stopMp4Export();
        return;
      }

      if (audioContext.state === 'suspended') {
        await audioContext.resume();
      }

      audioElement.currentTime = 0;
      togglePlay(true);

      exportBtn.textContent = 'Initializing MP4 Export...';
      exportBtn.style.background = '#ff0055';

      muxer = new Mp4Muxer.Muxer({
        target: new Mp4Muxer.ArrayBufferTarget(),
        video: { codec: 'avc', width: canvas.width, height: canvas.height },
        audio: { codec: 'aac', sampleRate: audioContext.sampleRate, numberOfChannels: 2 },
        fastStart: 'in-memory'
      });

      videoEncoder = new VideoEncoder({
        output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
        error: e => console.error('VideoEncoder error:', e)
      });

      videoEncoder.configure({
        codec: 'avc1.42001f',
        width: canvas.width,
        height: canvas.height,
        bitrate: 6_000_000,
        framerate: 30
      });

      const dest = audioContext.createMediaStreamDestination();
      sourceNode.connect(dest);

      audioEncoder = new AudioEncoder({
        output: (chunk, meta) => muxer.addAudioChunk(chunk, meta),
        error: e => console.error('AudioEncoder error:', e)
      });

      audioEncoder.configure({
        codec: 'mp4a.40.2',
        sampleRate: audioContext.sampleRate,
        numberOfChannels: 2,
        bitrate: 128_000
      });

      startTime = performance.now();
      let frameIndex = 0;
      const fps = 30;
      const intervalMs = 1000 / fps;

      exportBtn.textContent = 'Recording MP4... Click to Stop & Save';

      recordingInterval = setInterval(async () => {
        if (audioElement.ended) {
          stopMp4Export();
          return;
        }
        const timestamp = (performance.now() - startTime) * 1000;
        const frame = new VideoFrame(canvas, { timestamp });
        videoEncoder.encode(frame, { keyFrame: frameIndex % 60 === 0 });
        frame.close();
        frameIndex++;
      }, intervalMs);

      const processor = audioContext.createScriptProcessor(4096, 2, 2);
      sourceNode.connect(processor);
      processor.connect(audioContext.destination);

      processor.onaudioprocess = (e) => {
        if (!audioEncoder || audioEncoder.state === 'closed') return;
        const inputBuffer = e.inputBuffer;
        const audioData = new AudioData({
          format: 'f32-planar',
          sampleRate: inputBuffer.sampleRate,
          numberOfFrames: inputBuffer.length,
          numberOfChannels: 2,
          timestamp: (performance.now() - startTime) * 1000,
          data: [inputBuffer.getChannelData(0), inputBuffer.getChannelData(1)]
        });
        audioEncoder.encode(audioData);
        audioData.close();
      };

      window.activeAudioProcessor = processor;
    });

    async function stopMp4Export() {
      if (recordingInterval) clearInterval(recordingInterval);
      if (window.activeAudioProcessor) {
        window.activeAudioProcessor.disconnect();
        window.activeAudioProcessor = null;
      }

      if (videoEncoder) {
        await videoEncoder.flush();
        videoEncoder.close();
        videoEncoder = null;
      }

      if (audioEncoder) {
        await audioEncoder.flush();
        audioEncoder.close();
        audioEncoder = null;
      }

      if (muxer) {
        muxer.finalize();
        const buffer = muxer.target.buffer;
        const blob = new Blob([buffer], { type: 'video/mp4' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = 'vizzzual.mp4';
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          window.URL.revokeObjectURL(url);
        }, 100);
        muxer = null;
      }

      exportBtn.textContent = 'Export MP4 Video';
      exportBtn.style.background = 'var(--accent-color)';
    }
  </script>
</body>
